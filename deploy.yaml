services:
  foxess-exporter:
    image: ghcr.io/jasoncabot/foxess_exporter:main
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 16M
    environment:
      FOX_HOST: 192.168.1.83
      LISTEN_PORT: 9877
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 10s
      test:
        - CMD
        - wget
        - '-q'
        - '--spider'
        - http://0.0.0.0:9877/healthz
      timeout: 5s
    ports:
      - 192.168.100.0:30877:9877
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: '568:568'
