services:
  foxess-exporter:
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 16M
    environment:
      FOX_HOST: 192.168.1.207
      LISTEN_PORT: 9877
    healthcheck:
      disable: True
    image: ghcr.io/jasoncabot/foxess_exporter:latest
    ports:
      - 192.168.100.0:30877:9877
    read_only: True
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: '568:568'
